spring.application.name=AIAudioTranscriber
server.port=${PORT:2222}


# Secure way to inject the OpenAI API Key from env
spring.ai.openai.api-key=${API_KEY:dummy-key}

spring.ai.openai.audio.transcription.base-url=https://api.openai.com
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.response-format=json

# Allow larger audio file uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB